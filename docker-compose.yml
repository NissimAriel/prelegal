services:
  prelegal:
    build: .
    container_name: prelegal
    # OPENROUTER_API_KEY, for the AI chat. The file is gitignored and never
    # copied into the image, so the key stays on the host and reaches the
    # container only as an environment variable at run time.
    env_file:
      - .env
    ports:
      - '8000:8000'
    restart: unless-stopped
    # No volume for the SQLite file on purpose: the database is recreated from
    # scratch on every start (see backend/app/db.py), so persisting it would
    # only preserve a file the app deletes on the way up.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
