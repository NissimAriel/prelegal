[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API — serves the API and the statically built frontend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.100.0",
    "pydantic[email]>=2.10",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
